name: CI

# One workflow for the whole repository: checks, end-to-end tests, and a deploy from
# main once both pass.
on:
  push:
    branches: [main]
  pull_request:
  # Runs every job (and deploys, from main), e.g. after changing repository variables.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main are never cancelled, since
# one may be halfway through a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Browsers are cached per Playwright version; the system packages they need
      # aren't, so they're installed either way.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ourdiu/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ourdiu/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ourdiu/web exec playwright install-deps chromium
      - name: Prepare local API secrets and database
        run: |
          printf "BETTER_AUTH_SECRET=%s\n" "$(openssl rand -base64 32)" > apps/web/.dev.vars
          # Placeholder Google client: the e2e tests never reach Google.
          printf "GOOGLE_CLIENT_ID=e2e-client-id\nGOOGLE_CLIENT_SECRET=e2e-client-secret\n" >> apps/web/.dev.vars
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Deploys main once the checks have passed. Skipped until the repository variable
  # SITE_URL is set (see "Deploying" in the README for the one-time setup).
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    # Never cancel a deploy halfway, and run them one at a time in push order.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Schema first, so new code never runs against the old one.
      - name: Apply D1 migrations
        run: pnpm --filter @ourdiu/api db:migrate:remote
      - name: Deploy the Worker
        working-directory: apps/web
        run: pnpm build && pnpm exec wrangler deploy --var "SITE_URL:${{ vars.SITE_URL }}"
