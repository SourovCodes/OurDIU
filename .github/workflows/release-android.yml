name: Release Android

# Pushing a tag like mobile-v1.2.3 (on a commit that's on main) builds a signed App
# Bundle and releases it to the closed testing track on Google Play, so testers get
# the update from the Play Store. Setup and the release steps: "Releasing the
# Android app" in the README.
on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    name: Build & upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the upload key; Google Cloud only trusts this repository's jobs in this
    # environment on mobile-v* tags.
    environment: play
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # mobile-vMAJOR.MINOR.PATCH → versionName MAJOR.MINOR.PATCH and versionCode
      # MAJOR*1000000 + MINOR*1000 + PATCH, which grows with every release.
      - name: Read the version from the tag
        id: version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^mobile-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags look like mobile-v1.2.3."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( $minor > 999 || $patch > 999 || $major > 2000 )); then
            echo "::error::Minor and patch go up to 999, major to 2000."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag a commit that is on main, so CI has checked it."
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(($major * 1000000 + $minor * 1000 + $patch))" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: flutter pub get
      - run: flutter test
      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The play environment needs the ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD secrets."
            exit 1
          fi
          base64 --decode <<<"$KEYSTORE_BASE64" > android/upload-keystore.jks
          # PKCS12 keystores use one password for the store and the key.
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: >-
          flutter build appbundle --release
          --build-name ${{ steps.version.outputs.name }}
          --build-number ${{ steps.version.outputs.code }}
      - run: rm android/key.properties android/upload-keystore.jks
      # Kept so a build can also be installed or uploaded by hand.
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      # What testers see under "What's new": the tag's message (git tag -a), or else
      # the subjects of the app's commits since the last release. Play allows 500
      # characters.
      - name: Write the release notes
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          # Checkout can leave an annotated tag lightweight; fetch the tag itself.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d')
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ] || [ -z "${notes//[$'\n ']/}" ]; then
            previous=$(git describe --tags --abbrev=0 --match 'mobile-v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            notes=$(git log --no-merges --format='• %s' ${previous:+"$previous.."}"$GITHUB_SHA" -- . | head -n 8)
          fi
          [ -n "$notes" ] || notes="Fixes and improvements."
          printf '%s' "$notes" | head -c 500 > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # Pinned to a commit: it handles the Play credentials.
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.ourdiu.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          # Closed testing ("alpha"), rolled out to its testers as soon as Google has
          # reviewed it, until the app has production access. The PLAY_TRACK and
          # PLAY_RELEASE_STATUS repository variables override these (e.g. internal and
          # draft).
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
