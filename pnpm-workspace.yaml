packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

# Single source of truth for versions shared across workspace packages.
catalog:
  "@types/node": ^24.19.1
  hono: ^4.13.13
  typescript: ~6.0.3
  vitest: ~4.1.11
  wrangler: ^4.147.0
  zod: ^4.6.5

minimumReleaseAgeExclude:
